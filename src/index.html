<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thirteen</title>
    <meta property="og:title" content="Thirteen" />
    <meta property="og:description" content="A web-based version of the popular card game Thirteen (Tiến Lên)." />
    <meta property="og:image" content="https://13.thekaveman.dev/logo.png" />
    <meta property="og:url" content="https://13.thekaveman.dev/" />
    <meta property="og:type" content="website" />
    <link rel="stylesheet" href="style.css" type="text/css" />
    <script src="https://cdn.amplitude.com/script/5f9c6d8af1fb6d26924ad4f9a016840b.js"></script>
    <script>
      window.amplitude.add(window.sessionReplay.plugin({ sampleRate: 1 }));
    </script>
  </head>
  <body>
    <div id="game-container">
      <header>
        <img src="logo.png" alt="Thirteen card game logo" class="logo" />
        <h1>Thirteen</h1>
        <a href="help.html">📖 Help</a>
      </header>
      <div id="game-board">
        <div id="play-area">
          <div id="game-content"></div>
        </div>
        <div id="players-hands"></div>
      </div>
      <div id="game-messages"></div>
      <div id="controls">
        <button id="start-game-button">Start</button>
        <button id="add-ai-player-button">+ AI</button>
        <button id="remove-ai-player-button">- AI</button>
        <button id="play-button" style="display: none">Play</button>
        <button id="pass-button" style="display: none">Pass</button>
        <button id="new-game-button" style="display: none">New Game</button>
        <button id="cancel-button" style="display: none">Cancel</button>
        <button id="resign-button" style="display: none">Resign</button>
        <button id="reset-button" style="display: none">Reset</button>
      </div>
    </div>
    <div id="game-footer" class="game-footer">
      <span class="made-by"
        >Made with ❤️ by thekaveman | <a href="https://github.com/thekaveman/thirteen" target="_blank">Source code</a> |
      </span>
      <span class="version"></span>
    </div>
    <script type="module">
      import { App } from "./app/app.js";
      App.create();
    </script>
  </body>
</html>
